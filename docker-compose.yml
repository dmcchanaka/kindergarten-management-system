version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kindergarten-app
    container_name: kindergarten-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    user: "1000:1000"
    networks:
      - kindergarten-network

  web:
    image: nginx:alpine
    container_name: kindergarten-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - kindergarten-network

  db:
    image: mysql:8.0
    container_name: kindergarten-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: kindergarten_db
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - kindergarten-network

  vite:
    image: node:18-alpine
    container_name: kindergarten-vite
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    networks:
      - kindergarten-network

networks:
  kindergarten-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
