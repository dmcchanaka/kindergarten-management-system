services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_APP_API_URL=${VITE_APP_API_URL}
    image: kindergarten-app-prod
    container_name: kindergarten-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app-data:/var/www
      - ./.env:/var/www/.env
    command: sh -c "mkdir -p /var/www/public/build && cp -rp /tmp/build-dist/. /var/www/public/build/ || true; php-fpm"
    networks:
      - kindergarten-network

  web:
    image: nginx:alpine
    container_name: kindergarten-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"  # Map Nginx container port 80 to host port 8081 internally only
    volumes:
      - app-data:/var/www
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - kindergarten-network

  db:
    image: mysql:8.0
    container_name: kindergarten-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kindergarten_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - kindergarten-network

networks:
  kindergarten-network:
    driver: bridge

volumes:
  app-data:
  dbdata:
    driver: local
