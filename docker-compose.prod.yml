version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kindergarten-app-prod
    container_name: kindergarten-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app-data:/var/www
    networks:
      - kindergarten-network

  web:
    image: nginx:alpine
    container_name: kindergarten-web
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app-data:/var/www
      - ./docker/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-var:/var/lib/letsencrypt:ro
      - certbot-web:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - kindergarten-network

  db:
    image: mysql:8.0
    container_name: kindergarten-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kindergarten_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - kindergarten-network

  certbot:
    image: certbot/certbot
    container_name: kindergarten-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - certbot-web:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

networks:
  kindergarten-network:
    driver: bridge

volumes:
  app-data:
  dbdata:
    driver: local
  certbot-etc:
  certbot-var:
  certbot-web:
